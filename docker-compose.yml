version: '3.8'

services:
  mongodb:
    image: mongo:7.0
    container_name: stepcharge-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: stepcharge
    volumes:
      - mongo-data:/data/db
    networks:
      - stepcharge-net
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  ml-service:
    build:
      context: ./ml-service
      dockerfile: Dockerfile
    container_name: stepcharge-ml-service
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      PORT: 8000
      CORS_ORIGINS: "http://localhost,http://localhost:5000,http://localhost:5173"
    networks:
      - stepcharge-net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: stepcharge-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      NODE_ENV: production
      PORT: 5000
      MONGODB_URI: mongodb://mongodb:27017/stepcharge
      JWT_SECRET: ${JWT_SECRET:-stepcharge_super_secure_jwt_secret_change_in_production_key_32_bytes_min}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      ML_SERVICE_URL: http://ml-service:8000
      ALLOWED_ORIGINS: "http://localhost,http://localhost:80,http://localhost:5173"
      COOKIE_DOMAIN: localhost
      SECURE_COOKIES: "false"
    depends_on:
      mongodb:
        condition: service_healthy
      ml-service:
        condition: service_started
    networks:
      - stepcharge-net

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: stepcharge-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - stepcharge-net

networks:
  stepcharge-net:
    driver: bridge

volumes:
  mongo-data:
    driver: local
